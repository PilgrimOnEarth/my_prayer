<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나의 기도">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>나의 기도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one reading column. Sticky header holds 아침/저녁 switch + progress; prayers stack below as plain sheets. */
:root{
  --ui:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --text:'Noto Serif KR','Nanum Myeongjo','Apple Myungjo',Batang,serif;
  --bg:#F3F4F7; --surface:#FFFFFF; --fg:#1D2130; --muted:#5B6275; --line:#D9DCE6;
  --accent-am:#955700; --soft-am:#F6E7CF;
  --accent-pm:#4A4EA6; --soft-pm:#E5E6F6;
  --on-accent:#FFFFFF;
  --fs:18;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12141B; --surface:#1A1D27; --fg:#E8EAF1; --muted:#A3AABB; --line:#2C3142;
    --accent-am:#EDB963; --soft-am:#3A2F1B;
    --accent-pm:#AAB1FF; --soft-pm:#282C4B;
    --on-accent:#14161C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12141B; --surface:#1A1D27; --fg:#E8EAF1; --muted:#A3AABB; --line:#2C3142;
  --accent-am:#EDB963; --soft-am:#3A2F1B;
  --accent-pm:#AAB1FF; --soft-pm:#282C4B;
  --on-accent:#14161C; color-scheme:dark;
}
body{--accent:var(--accent-am);--soft:var(--soft-am)}
body[data-session="pm"]{--accent:var(--accent-pm);--soft:var(--soft-pm)}
body{
  background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{margin:0;font:700 22px/1.2 var(--ui);letter-spacing:-.01em}
.brand .date{color:var(--muted);font-size:13px}
.tools{display:flex;gap:6px}
.tool{min-height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:14px;font-weight:500}
.tool[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{min-height:46px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:16px;font-weight:500;display:flex;gap:8px;align-items:center;justify-content:center}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.seg svg{width:20px;height:20px;flex:none}
.prog{display:grid;gap:6px}
.prog-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:thin}
.chip{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:18px;font-size:14px;color:var(--fg);white-space:nowrap}
.chip.done{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chip.done::before{content:"✓ "}

.prayer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px 18px;margin-top:14px;scroll-margin-top:170px}
.prayer h2{margin:0 0 14px;font:600 calc((var(--fs) + 2) * 1px)/1.45 var(--text);text-wrap:balance;word-break:keep-all}
.prayer h2 small{display:block;font:400 13px var(--ui);color:var(--muted);margin-top:2px}
.body{font-family:var(--text);font-size:calc(var(--fs) * 1px);line-height:1.95;word-break:keep-all;overflow-wrap:break-word}
.body p{margin:0 0 .9em}
.body p.rub{color:var(--muted)}
.mk{color:var(--accent);font-size:.8em;margin-right:.2em}
.empty{color:var(--muted);font-family:var(--ui);font-size:14px;margin:0}
details.en{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
details.en summary{cursor:pointer;color:var(--accent);font-weight:500;min-height:40px;display:flex;align-items:center}
details.en .body{font-family:Georgia,'Times New Roman',serif;line-height:1.8}
.done-btn{width:100%;min-height:50px;margin-top:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:12px;font-size:16px;font-weight:700}
.done-btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.finish{margin-top:18px;padding:18px;border-radius:14px;background:var(--soft);color:var(--accent);font-weight:700;text-align:center}
.reset{display:block;margin:18px auto 0;min-height:40px;padding:0 16px;border:1px solid var(--line);background:transparent;border-radius:10px;color:var(--muted);font-size:14px}

.editor{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.editor h2{margin:0 0 4px;font:700 17px var(--ui)}
.editor p.hint{margin:0 0 12px;color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.row .nm{min-width:0;font-size:14px;word-break:keep-all}
.mini{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.mini button{min-height:38px;min-width:48px;padding:0 10px;border:0;background:transparent;color:var(--muted);font-size:13px}
.mini button+button{border-left:1px solid var(--line)}
.mini button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
footer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="brand"><h1>나의 기도</h1><div class="date" id="date"></div></div>
      <div class="tools">
        <button class="tool" data-act="fs-" aria-label="글자 작게">가−</button>
        <button class="tool" data-act="fs+" aria-label="글자 크게">가+</button>
        <button class="tool" data-act="edit" id="editBtn" aria-pressed="false">구성</button>
      </div>
    </div>
    <div class="seg" role="tablist" aria-label="기도 시간">
      <button role="tab" id="tab-am" data-act="session" data-s="am">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="14" r="4"/><path d="M12 3v3M4.2 8.2l2.1 2.1M19.8 8.2l-2.1 2.1M2 20h20"/></svg>아침기도
      </button>
      <button role="tab" id="tab-pm" data-act="session" data-s="pm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>저녁기도
      </button>
    </div>
    <div class="prog">
      <div class="prog-row"><span id="progText"></span><span id="progCount"></span></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
  </header>

  <nav class="chips" id="chips" aria-label="기도 목록"></nav>
  <main id="list"></main>
  <div id="finish"></div>
  <section class="editor" id="editor" hidden></section>
  <footer>원문: Google 드라이브 ‘나의 기도’ · 체크 표시와 구성은 이 기기에만 저장됩니다</footer>
</div>

<script>
const PRAYERS = [
{id:'creed', def:'am', title:'니케아 콘스탄티노폴리스 신경', sub:'The Nicene Creed', body:
`한 분이신 하느님을
⭗ 저는 믿나이다.

하늘과 땅과 유형무형한 만물의 창조주를 믿나이다.

또한 한 분이신 주 예수 그리스도, 하느님의 외아들
영원으로부터 성부에게서 나신 분을 믿나이다.
하느님에게서 나신 하느님, 빛에서 나신 빛
참 하느님에게서 나신 참 하느님으로서,
창조되지 않고 나시어
성부와 한 본체로서 만물을 창조하셨음을 믿나이다.

성자께서는 저희 인간을 위하여, 저희 구원을 위하여
하늘에서 내려오셨음을 믿나이다.

또한 성령으로 인하여 동정 마리아에게서 육신을 취하시어 사람이 되셨음을 믿나이다.

본시오 빌라도 통치 아래서 저희를 위하여
십자가에 못박혀 수난하고 묻히셨으며
성서 말씀대로 사흗날에 부활하시어
하늘에 올라 성부 오른편에 앉아계심을 믿나이다.

그분께서는 산 이와 죽은 이를 심판하러
영광 속에 다시 오시리니
그분의 나라는 끝이 없으리이다.

또한 주님이시며 생명을 주시는 성령을 믿나이다.
성령께서는 성부와 더불어 영광과 흠숭을 받으시며
예언자들을 통하여 말씀하셨나이다.

하나이고 거룩하고 보편되며
사도로부터 이어오는 교회를 믿나이다.

죄를 씻는 유일한 세례를 믿으며
죽은 이들의 부활과 내세의 삶을 기다리나이다.

아멘.`,
en:
`I believe in one God,
the Father almighty,
maker of heaven and earth,
of all things visible and invisible.

I believe in one Lord Jesus Christ,
the Only Begotten Son of God,
born of the Father before all ages.
God from God, Light from Light,
true God from true God,
begotten, not made, consubstantial with the Father;
through him all things were made.
For us men and for our salvation
he came down from heaven,
and by the Holy Spirit was incarnate of the Virgin Mary,
and became man.
For our sake he was crucified under Pontius Pilate,
he suffered death and was buried,
and rose again on the third day
in accordance with the Scriptures.
He ascended into heaven
and is seated at the right hand of the Father.
He will come again in glory
to judge the living and the dead
and his kingdom will have no end.

I believe in the Holy Spirit, the Lord, the giver of life,
who proceeds from the Father and the Son,
who with the Father and the Son is adored and glorified,
who has spoken through the prophets.

I believe in one, holy, catholic and apostolic Church.
I confess one Baptism for the forgiveness of sins
and I look forward to the resurrection of the dead
and the life of the world to come. Amen.`},

{id:'confiteor', def:'pm', title:'고백 기도', body:
`전능하신 하느님과 형제들에게 고백하오니 생각과 말과 행위로 죄를 많이 지었으며 자주 의무를 소홀히 하였나이다. (가슴을 치며) 제 탓이요 (가슴을 치며) 제 탓이요 (가슴을 치며) 저의 큰 탓이옵니다. 그러므로 간절히 바라오니 평생 동정이신 성모 마리아와 모든 천사와 성인과 형제들은 저를 위하여 하느님께 빌어 주소서.`},

{id:'contrition', def:'pm', title:'통회 기도', body:
`하느님, 제가 죄를 지어 참으로 사랑받으셔야 할 하느님의 마음을 아프게 하였기에 악을 저지르고 선을 멀리한 모든 잘못을 진심으로 뉘우치나이다.

하느님의 은총으로 속죄하고 다시는 죄를 짓지 않으며 죄지을 기회를 피하기로 굳게 다짐하오니 우리 구세주 예수 그리스도의 수난 공로를 보시고 저에게 자비를 베풀어 주소서. 아멘.`},

{id:'faith', def:'am', title:'신덕송', body:
`하느님, 하느님께서는 진리의 근원이시며 그르침이 없으시므로 계시하신 진리를 교회가 가르치는 대로 굳게 믿나이다.`},

{id:'hope', def:'am', title:'망덕송', body:
`하느님, 하느님께서는 자비의 근원이시며 저버림이 없으시므로 예수 그리스도의 공로를 통하여 주실 구원의 은총과 영원한 생명을 바라나이다.`},

{id:'charity', def:'am', title:'애덕송', body:
`하느님, 하느님께서는 사랑의 근원이시며 한없이 좋으시므로 마음을 다하여 주님을 사랑하며 이웃을 제 몸같이 사랑하나이다.`},

{id:'offering', def:'am', title:'봉헌 기도', body:
`하느님, 저를 사랑으로 내시고 저에게 영혼 육신을 주시어 주님만을 섬기고 사람을 도우라 하셨나이다. 저는 비록 죄가 많사오나 주님께 받은 몸과 마음을 오롯이 도로 바쳐 찬미와 봉사의 제물로 드리오니 어여삐 여기시어 받아 주소서. 아멘.`},

{id:'heart', def:'am', title:'성모 성심께 바치는 봉헌 기도', body:
`○ 어지신 어머니, 든든한 힘이신 동정녀, 하늘의 모후요 죄인의 피신처이신 성모님, 티 없이 깨끗하신 성모 성심께 저희를 봉헌하나이다.

● 저희 자신과 가진 것을 모두 바치며 온전한 사랑으로 저희 가정과 조국을 성심께 봉헌하나이다.

○ 저희 몸과 마음을 바치오니 저희 안에 있는 것, 저희 주위에 있는 것 모두 성모님의 것이 되게 하시고 저희에게는 오로지 성모님 사랑의 한몫을 나누어 주소서.

● 성모님, 이 봉헌대로 살고자 저희는 세례 때와 첫영성체 때에 한 서약을 오늘 다시 새롭게 하나이다.

○ 저희는 신앙의 진리를 언제나 용감히 고백하며 교황과 그와 결합되어 있는 주교들에게 온전히 순종하고 하느님의 계명과 교회의 법규를 충실히 지키며 특별히 주일을 거룩히 지내고 열심히 살아가며 자주 영성체할 것을 약속하나이다.

● 하느님의 영광 지극하신 어머니, 인류의 어지신 어머니, 온 마음을 바쳐 어머니를 공경하며 하늘에서와 같이 땅에서도 저희와 모든 사람의 마음과 저희 조국과 온 세계에 티 없이 깨끗하신 성심의 나라를 하루바삐 세우도록 충실히 노력할 것을 약속하나이다. ⭗ 아멘.`},

{id:'mary', def:'am', title:'성모님께 자기를 바치는 기도', body:
`○ 천주의 성모 마리아님, 저희는 비록 성모님을 모시기에 합당치 않사오나 성모님의 사랑을 굳게 믿으며 모든 천사와 더불어 성모님을 어머니로 모시는 저희를 자애로이 지켜 주소서.

● 저희는 성모님의 아들 예수님을 더욱 충실히 섬기며 어머니 슬하에 살기로 약속하나이다.

○ 십자가에 높이 달리신 예수님께서는 숨을 거두시며 당신 자신은 성부께 맡기시고 성모님은 제자에게, 제자는 성모님께 맡기셨나이다.

● 지극히 거룩하신 어머니, 십자가 밑에서 맺어진 모자의 인연으로 저희를 품에 안아 주시고 온갖 위험과 고통 중에 돌보아 주시며 죽을 때에 저희를 저버리지 마소서. ⭗ 아멘.`},

{id:'aquinas', def:'am', title:'성 토마스의 성체 찬미가', body:
`○ 엎드려 절하나이다. 눈으로 보아 알 수 없는 하느님, 두 가지 형상 안에 분명히 계시오나 우러러 뵈올수록 전혀 알 길 없기에 제 마음은 오직 믿을 뿐이옵니다.

● 보고 맛보고 만져 봐도 알 길 없고 다만 들음으로써 믿음 든든해지오니 믿나이다. 천주 성자 말씀하신 모든 것을. 주님의 말씀보다 더 참된 진리 없나이다.

○ 십자가 위에서는 신성을 감추시고 여기서는 인성마저 아니 보이시나 저는 신성, 인성을 둘 다 믿어 고백하며 뉘우치던 저 강도의 기도 올리나이다.

● 토마스처럼 그 상처를 보지는 못하여도 저의 하느님이심을 믿어 의심 않사오니 언제나 주님을 더욱더 믿고 바라고 사랑하게 하소서.

○ 주님의 죽음을 기념하는 성사여, 사람에게 생명 주는 살아 있는 빵이여, 제 영혼 주님으로 살아가고 언제나 그 단맛을 느끼게 하소서.

● 사랑 깊은 펠리칸, 주 예수님, 더러운 저를 주님의 피로 씻어 주소서. 그 한 방울만으로도 온 세상을 모든 죄악에서 구해 내시리이다.

○ 예수님, 지금은 가려져 계시오나 이렇듯 애타게 간구하오니 언젠가 드러내실 주님 얼굴 마주 뵙고 주님 영광 바라보며 기뻐하게 하소서. ⭗ 아멘.`},

{id:'tedeum', def:'pm', title:'성 아브로시오의 사은 찬미가', sub:'Te Deum', body:
`○ 찬미하나이다. 주 하느님. 주님이신 하느님을 찬양하나이다.

● 영원하신 아버지를 온 세상이 받들어 모시나이다.

○ 모든 천사들이 하늘과 세상의 권능 천사들이 케루빔과 세라핌이 끊임없이 목소리를 높여 노래하나이다.

● 거룩하시도다, 거룩하시도다, 거룩하시도다. 온 누리의 주 하느님 하늘과 땅에 가득 찬 엄위로우신 그 영광.

○ 영광에 빛나는 사도들의 모임 그 보람 드러나는 예언자들의 대열 눈부신 순교자들의 무리가 아버지를 드높이 기리나이다.

● 땅에서는 어디서나 거룩한 교회가 그지없이 엄위하신 아버지를 받들어야 할 아드님, 외아드님을 아울러 보호자 성령님을 찬양하나이다.

○ 영광의 임금님이신 그리스도 하느님 아버지의 영원하신 아드님 인간을 구하시려 동정녀의 태중을 꺼리지 않으시고 몸소 인간이 되셨나이다.

● 죽음의 독침을 물리치시고 믿는 이들에게 천국을 열어 주셨나이다.

○ 하느님의 오른편, 아버지의 영광 안에 계시며 세상을 심판하러 오시리라 믿나이다.

● 보배로운 피로 구원받은 종들인 저희를 보호하시기를 비오니 저희도 성인들과 한 무리에 들어 영원토록 영광을 누리게 하소서.

○ 주님, 주님의 백성을 구원하시고 주님의 상속자들에게 강복하소서.

● 그 백성 주님께서 다스리시고 영원토록 이끌어 주소서.

○ 나날이 주님을 찬양하는 저희 세세 대대 주님 이름 찬미하리이다.

● 주님, 비오니 오늘 저희를 죄짓지 않도록 지켜 주소서.

○ 주님, 저희에게 자비를 베푸소서.

● 저희에게 자비를 베푸소서.

○ 주님, 저희가 주님께 바란 대로 저희에게 자비를 내리소서.

● 주님, 저희가 주님께 바랐사오니 영원토록 부끄러움 없으리이다.`},

{id:'pope', def:'am', title:'교황이나 주교를 위한 기도', body:
`모든 믿는 이들의 목자요 인도자이신 하느님, 하느님의 일꾼 (아무)를 교회의 목자로 세우셨으니 그를 인자로이 굽어보시어 올바른 말과 행동으로 맡은 양 떼를 보살피고 마침내 그들과 함께 영원한 생명에 이르게 하소서. 우리 주 그리스도를 통하여 비나이다. ⭗ 아멘.`},

{id:'priests', def:'am', title:'사제들을 위한 기도 2', body:
`○ 지극히 사랑하올 예수님, 주님을 충실히 따르고 사랑하는 사제들을 굽어살피시고 그들의 마음을 성령으로 가득 채우시어 이 세상의 빛과 소금이 되게 하소서.

● 사제들이 주님의 사랑을 깨닫고 증언하며 주님의 믿음을 따르고 지켜 가게 하소서. 또한 주님의 희생을 본받고 실천하며 주님의 가난을 받아들여 자유로워지고 주님의 겸손을 배워 스스로를 낮추게 하소서.

○ 사제들이 언제 어디서나 주님만을 바라고 의지하여 하느님 백성의 길잡이가 되고 일치의 중심이 되게 하소서.

● 사제들이 모범이 되어 성실한 젊은이들이 주님의 부르심을 깨닫고 기꺼이 응답하게 하소서. ⭗ 아멘.`},

{id:'religious', def:'am', title:'수도자들을 위한 기도', body:
`○ 세례성사의 은총을 더욱 풍부하게 열매 맺도록 자녀들을 수도자의 길로 부르시는 하느님, 수도자들을 통하여 끊임없이 하느님을 찾고 오롯한 사랑으로 그리스도께 봉헌하는 삶이 교회의 시작부터 지금까지 지속되게 하시니 감사하나이다.

● 하느님, 수도자들이 성령께 온전히 귀 기울여 복음의 증거자로서 정결과 청빈과 순명의 삶을 살게 하시어 자유로이 그리스도를 따르고 더욱 그리스도를 닮아 세상의 구원을 위하여 기도하고 봉사하게 하소서. 우리 주 그리스도를 통하여 비나이다. ⭗ 아멘.`},

{id:'laity', def:'am', title:'평신도 사도직을 위한 기도', body:
`○ 주 예수 그리스도님, 저희를 하느님의 백성으로 부르시어 한 형제자매로 살아가게 하셨으니 주님께서 도와주시어 교회와 사회 안에서 주님의 말씀을 충실히 실천하게 하소서.

● 주님께서는 길이요 진리요 생명이시니 저희가 주님 안에서 인생의 참뜻을 발견하고 세상의 온갖 유혹에서 해방되어 그리스도인의 드높은 품위를 지켜 가게 하소서.

○ 주님께서는 저희를 사도직에 부르셨으니 성령의 불로 저희를 새롭게 하시어 선의를 지닌 모든 사람과 힘을 합쳐 이 세상에 진리와 자유, 정의와 사랑이 넘치는 하느님 나라를 세우게 하소서. 주님께서는 영원히 살아 계시며 다스리시나이다. ⭗ 아멘.`},

{id:'unity', def:'am', title:'그리스도교 일치를 위한 기도', body:
`○ 주 예수 그리스도님, 주님께서는 돌아가시기 전날 밤에 아버지께 기도하신 대로 주님과 아버지께서 하나이시듯 주님을 믿는 모든 이가 하나 되기를 바라셨나이다.

● 저희는 같은 믿음으로 세례를 받고 같은 주님을 모시면서도 서로 갈라져 주님의 뜻을 이루지 못하고 있나이다.

○ 이제 저희는 한마음으로 기도하며 하나가 되고자 하오니

● 저희를 도와주시어 미움과 불신을 버리고 진리 안에서 서로 사랑하며 하나의 공동체를 이루게 하소서. ◎ 아멘.`},

{id:'nation', def:'am', title:'민족의 화해와 일치를 위한 기도', body:
`○ 사람을 당신의 모습대로 지어내신 주님, 저희가 모두 주님을 닮게 하소서.

● 사랑으로 하나 되신 주님처럼 저희가 서로 사랑하여 하나 되게 하소서.

○ 평화를 바라시는 주님, 이 나라 이 땅에 잃어버린 평화를 되찾게 하소서.

● 한 핏줄 한 겨레이면서도 서로 헐뜯고 싸웠던 저희 잘못을 깨우쳐 주소서.

○ 분단의 깊은 상처를 낫게 하시고 서로 용서하는 화해의 은총을 내려 주소서.

● 인류의 일치를 바라시는 주님, 갈라져 사는 저희 겨레의 아픔을 어루만져 주소서.

○ 저희의 무관심을 깨닫게 하시어 겨레의 일치를 위하여 열심히 일하고 가진 바를 나누게 하소서.

● 서로 존중하고 사랑하며 평화 통일을 이룩하게 하소서.

○ 온 겨레가 주님을 믿어 이 땅에 주님의 나라를 이루게 하소서. 우리 주 그리스도를 통하여 비나이다. ◎ 아멘.

○ 평화의 모후시여,

● 저희를 위하여 빌어 주소서.

○ 한국의 모든 순교 성인이여,

● 저희를 위하여 빌어 주소서.`},

{id:'parents', def:'pm', title:'부모를 위한 기도', body:
`○ 인자하신 하느님, 하느님께서는 부모를 사랑하고 공경하며 그 은덕에 감사하라 하셨으니 저희가 효성을 다하여 부모를 섬기겠나이다.

● 저희 부모는 저희를 낳아 기르며 갖은 어려움을 기쁘게 이겨 냈으니 이제는 그 보람을 느끼며 편히 지내게 하소서.

○ 주님, 저희 부모에게 강복하시고 은총으로 지켜 주시며 마침내 영원한 행복을 누리게 하소서. 우리 주 그리스도를 통하여 비나이다. ◎ 아멘.`},

{id:'children', def:'pm', title:'자녀를 위한 기도', body:
`○ 세상을 창조하신 하느님, 하느님께서는 저희에게 귀한 자녀를 주시어 창조를 이어가게 하셨으니 주님의 사랑으로 자녀를 길러 주님의 영광을 드러내게 하소서.

● 주님, 사랑하는 저희 자녀를 은총으로 보호하시어 세상 부패에 물들지 않게 하시며 온갖 악의 유혹을 물리치고 예수님을 본받아 주님의 뜻을 이루는 일꾼이 되게 하소서. 우리 주 그리스도를 통하여 비나이다. ◎ 아멘.`},

{id:'goodDeath', def:'pm', title:'선종을 위한 기도', body:
`○ 죽음을 이기고 부활하신 주님, 저에게 선종하는 은혜를 주시어 죽음을 맞는 순간에도 영원한 천상 행복을 생각하고 주님을 그리워하며 기꺼이 죽음을 받아들이게 하소서. 아멘.`},

{id:'departed', def:'pm', title:'세상을 떠난 형제, 친척, 친구, 은인을 위한 기도', body:
`○ 사람의 구원을 기뻐하시는 하느님, 저희와 함께 주님을 섬기고 서로 사랑하며 구원의 길을 걸어온 저희 형제와 친척, 친구와 은인을 위하여 주님의 자비를 간구하오니 저희 기도를 들으시고 그들이 주님의 나라에서 영원한 행복을 누리게 하소서. ◎ 아멘.`},

{id:'litany', def:'pm', title:'성인 호칭 기도', body:
`○ 주님, 자비를 베푸소서.

● 주님, 자비를 베푸소서.

○ 그리스도님, 자비를 베푸소서.

● 그리스도님, 자비를 베푸소서.

○ 주님, 자비를 베푸소서.

● 주님, 자비를 베푸소서.

○ 하늘에 계신 천주 성부님

● 자비를 베푸소서.

(다음은 같은 후렴)

○ 세상을 구원하신 천주 성자님, 천주 성령님, 삼위일체이신 하느님

○ 성모 마리아님

● 저희를 위하여 빌어 주소서.

(다음은 같은 후렴)

○ 천주의 성모님, 지극히 거룩하신 동정녀, 성 미카엘, 성 가브리엘, 성 라파엘, 모든 천사와 대천사, 세례자 성 요한, 성 요셉, 모든 성조와 예언자, 성 베드로, 성 바오로, 성 안드레아, 성 요한, 성 야고보(대), 성 토마스, 성 야고보(소), 성 필립보, 성 바르톨로메오, 성 시몬, 성 타대오, 성 마태오, 성 마르코, 성 루카, 주님의 모든 거룩한 제자, 성 스테파노, 성 라우렌시오, 성 빈첸시오, 모든 거룩한 순교자, 성 실베스테르, 성 그레고리오, 성 암브로시오, 성 아우구스티노, 성 아타나시오, 성 요한 크리소스토모, 모든 거룩한 주교와 증거자, 모든 거룩한 학자, 성 안토니오, 성 베네딕토, 성 도미니코, 성 프란치스코, 모든 거룩한 사제와 부제, 모든 거룩한 수도자와 은수자, 성녀 마리아 막달레나, 성녀 아녜스, 성녀 체칠리아, 성녀 아가타, 성녀 아나스타시아, 모든 거룩한 동정녀와 부인, 성 김대건 안드레아, 성 정하상 바오로, 성 범 라우렌시오, 성녀 김효주 아녜스와 김효임 골룸바,

○ 우리나라의 모든 순교자, 하느님의 모든 성인

○ 주님, 자비를 베푸소서.

● 저희를 용서하소서.

○ 주님, 자비를 베푸소서.

● 저희의 기도를 들어주소서.

○ 온갖 악에서

● 주님, 저희를 구원하소서.

(다음은 같은 후렴)

○ 모든 죄에서, 영원한 죽음에서, 사람이 되신 주님의 신비로, 주님의 세례와 거룩한 재계로, 주님의 십자가와 수난으로, 주님의 죽음과 묻힘으로, 주님의 거룩한 부활로, 주님의 놀라운 승천으로, 성령의 강림으로, 심판 날에

○ 죄인들이 청하오니,

● 저희의 기도를 들어주소서.

(다음은 같은 후렴)

○ 저희를 용서하시기를 청하오니, 주님의 거룩한 교회를 다스리며 보존하시기를 청하오니

○ 하느님, 저를 구하소서. 주님, 어서 저를 도우소서.

● 이 목숨 노리는 자들은 수치를 당하여 부끄러워하고

○ 저의 불행을 즐기는 자들은 치욕을 느끼며 물러나게 하소서.

● “옳거니!” 하며 저를 놀려 대는 자들은 부끄러워 되돌아가게 하소서.

○ 당신을 찾는 이 모두 당신 안에서 기뻐 즐거워하리이다.

● 당신 구원을 열망하는 이들은 언제나 외치게 하소서. “하느님은 위대하시다!”

○ 저는 가련하고 불쌍하오니 하느님, 어서 제게 오소서.

● 주님, 저희에게 든든한 보루 되어 주시고 악인들의 손에서 지켜 주소서.

○ 악인들의 힘이 저희에게 미치지 못하게 하시고 악의 세력이 해치지 못하게 하소서.

● 주님, 저희 죄를 묻지 마시고 또한 저희 죄대로 벌하지 마소서.

{id:'lords', def:'both', title:'주님의 기도', body:
`하늘에 계신 우리 아버지, 아버지의 이름이 거룩히 빛나시며 아버지의 나라가 오시며 아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지소서! 오늘 저희에게 일용할 양식을 주시고 저희에게 잘못한 이를 저희가 용서하오니 저희 죄를 용서하시고 저희를 유혹에 빠지지 않게 하시고 악에서 구하소서. 아멘.`},

{id:'hail', def:'both', title:'성모송', body:
`은총이 가득하신 마리아님, 기뻐하소서. 주님께서 함께 계시니 여인 중에 복되시며 태중의 열매이신 예수님도 복되시나이다. 천주의 성모 마리아님, 이제와 저희 죽을 때에 저희 죄인을 위하여 빌어 주소서. 아멘.`},

{id:'glory', def:'both', title:'영광송', body:
`영광이 성부와 성자와 성령께 처음과 같이 이제와 항상 영원히. 아멘.`}
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const dayKey = () => { const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };

function fmt(body){
  return body.split('\n\n').map(par => {
    const m = par.match(/^\s*([○●◎╋])/);
    const cls = m ? (m[1] === '●' ? 'resp' : m[1] === '╋' ? 'rub' : '') : '';
    const html = esc(par).replace(/([○●◎╋⭗])/g, '<span class="mk">$1</span>').replace(/\n/g, '<br>');
    return '<p' + (cls ? ' class="'+cls+'"' : '') + '>' + html + '</p>';
  }).join('');
}

/* ---------- state ---------- */
let session = (location.hash === '#pm') ? 'pm' : (location.hash === '#am') ? 'am' : (new Date().getHours() >= 4 && new Date().getHours() < 15 ? 'am' : 'pm');
let assign = store.get('assign', {});
let fs = store.get('fs', 18);
let done = {};
let editing = false;

const slotOf = p => assign[p.id] || p.def;
const listFor = s => PRAYERS.filter(p => { const t = slotOf(p); return t === 'both' || t === s; });
const doneKey = () => 'done-' + dayKey() + '-' + session;

function render(){
  document.body.dataset.session = session;
  document.documentElement.style.setProperty('--fs', fs);
  $('tab-am').setAttribute('aria-selected', session === 'am');
  $('tab-pm').setAttribute('aria-selected', session === 'pm');
  $('date').textContent = new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'long'});
  done = store.get(doneKey(), {});
  const list = listFor(session);

  $('chips').innerHTML = list.map(p => '<button class="chip" data-act="jump" data-id="'+p.id+'" id="chip-'+p.id+'">'+esc(p.title.replace(/\s*\(.*\)/,''))+'</button>').join('');
  $('list').innerHTML = list.length ? list.map(p => {
    const sub = p.sub ? '<small>'+esc(p.sub)+'</small>' : '';
    const body = p.body ? '<div class="body">'+fmt(p.body)+'</div>' : '<p class="empty">원문 문서에 본문이 아직 없습니다.</p>';
    const en = p.en ? '<details class="en"><summary>English</summary><div class="body">'+fmt(p.en)+'</div></details>' : '';
    return '<section class="prayer" id="p-'+p.id+'"><h2>'+esc(p.title)+sub+'</h2>'+body+en+
      '<button class="done-btn" data-act="done" data-id="'+p.id+'" aria-pressed="false">바쳤습니다</button></section>';
  }).join('') : '<p class="empty" style="margin-top:20px">이 시간에 배정된 기도가 없습니다. 오른쪽 위 ‘구성’에서 추가하세요.</p>';

  renderEditor();
  updateStatus();
}

function updateStatus(){
  const list = listFor(session);
  const n = list.filter(p => done[p.id]).length;
  const total = list.length;
  list.forEach(p => {
    const b = document.querySelector('.done-btn[data-id="'+p.id+'"]');
    if (b){ b.setAttribute('aria-pressed', !!done[p.id]); b.textContent = done[p.id] ? '바쳤습니다 ✓' : '바쳤습니다'; }
    const c = $('chip-'+p.id); if (c) c.classList.toggle('done', !!done[p.id]);
  });
  $('progText').textContent = session === 'am' ? '오늘의 아침기도' : '오늘의 저녁기도';
  $('progCount').textContent = n + ' / ' + total;
  $('progBar').style.width = total ? (n / total * 100) + '%' : '0%';
  const complete = total > 0 && n === total;
  $('finish').innerHTML = complete
    ? '<div class="finish">'+(session === 'am' ? '아침기도를 모두 바쳤습니다. 아멘.' : '저녁기도를 모두 바쳤습니다. 아멘.')+'</div>' : '';
  if (n > 0) $('finish').insertAdjacentHTML('beforeend', '<button class="reset" data-act="reset">체크 초기화</button>');
}

function renderEditor(){
  const el = $('editor');
  el.hidden = !editing;
  $('editBtn').setAttribute('aria-pressed', editing);
  if (!editing) return;
  const opts = [['am','아침'],['pm','저녁'],['both','둘 다']];
  el.innerHTML = '<h2>기도 구성</h2><p class="hint">각 기도를 아침, 저녁, 둘 다 중에서 고릅니다. 순서는 원문 그대로입니다.</p>' +
    PRAYERS.map(p => {
      const cur = slotOf(p);
      return '<div class="row"><span class="nm">'+esc(p.title.replace(/\s*\(.*\)/,''))+'</span><div class="mini">' +
        opts.map(o => '<button data-act="assign" data-id="'+p.id+'" data-v="'+o[0]+'" aria-pressed="'+(cur === o[0])+'">'+o[1]+'</button>').join('') +
        '</div></div>';
    }).join('') +
    '<button class="reset" data-act="defaults">기본 구성으로 되돌리기</button>';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === 'session'){ session = t.dataset.s; history.replaceState(null, '', '#' + session); render(); window.scrollTo(0, 0); }
  else if (act === 'done'){
    done[id] = !done[id]; if (!done[id]) delete done[id];
    store.set(doneKey(), done); updateStatus();
    if (done[id]){
      const next = listFor(session).find(p => !done[p.id]);
      const target = next ? $('p-' + next.id) : null;
      if (target) target.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
    }
  }
  else if (act === 'jump'){ const el = $('p-' + id); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  else if (act === 'reset'){ done = {}; store.set(doneKey(), done); updateStatus(); }
  else if (act === 'fs+'){ fs = Math.min(30, fs + 2); store.set('fs', fs); document.documentElement.style.setProperty('--fs', fs); }
  else if (act === 'fs-'){ fs = Math.max(14, fs - 2); store.set('fs', fs); document.documentElement.style.setProperty('--fs', fs); }
  else if (act === 'edit'){ editing = !editing; renderEditor(); if (editing) $('editor').scrollIntoView({behavior: 'smooth'}); }
  else if (act === 'assign'){ assign[id] = t.dataset.v; store.set('assign', assign); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (act === 'defaults'){ assign = {}; store.set('assign', assign); const y = window.scrollY; render(); window.scrollTo(0, y); }
});
window.addEventListener('hashchange', () => {
  if (location.hash === '#am' || location.hash === '#pm'){ session = location.hash.slice(1); render(); }
});

/* keep the screen on while praying; ignore if refused */
async function keepAwake(){ try { if (navigator.wakeLock && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', keepAwake);
keepAwake();

render();

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
